# Pose Transformer Project Configuration

[data]
data_dir = "./data/chatsign_50k_norm"          # pkl数据目录 (路径相对于项目根目录)
video_dir = "./data/chatsign_200_videos"
ref_img_path = "./assets/img/test2.jpg"
ref_img_pose = "./assets/pose/ref.pkl"
ref_img_pose_im = "./assets/pose/test2.pkl"
sequence_length = 16          # 输入序列的长度（看过去多少帧）
n_kps = 69                   # 每帧的关键点数量
features_per_kp = 3           # 每个关键点的特征数 (x, y) # confidence
limit = 200

[model]
version = "v3"                # Model version to use
# d_model 必须能被 n_head 整-除
d_model = 768                 # Transformer的内部维度 (提升)
n_head = 12                   # 多头注意力的头数 (提升)
num_encoder_layers = 8        # Transformer编码器层数 (提升)
dim_feedforward = 3072        # 前馈网络的维度 (d_model * 4)
dropout = 0.1                 # Dropout比例

# --- Decoder settings (for V3 model) ---
decoder_d_model = 384         # Decoder的内部维度 (提升)
decoder_n_head = 6            # Decoder的多头注意力的头数 (提升)
num_decoder_layers = 4        # Decoder的层数 (提升)
decoder_dim_feedforward = 1536 # Decoder的前馈网络的维度 (decoder_d_model * 4)

[model_v3]
# Asymmetric Encoder-Decoder Transformer
encoder_hidden_dim = 512
encoder_num_heads = 8
encoder_num_layers = 6
decoder_hidden_dim = 256
decoder_num_heads = 8
decoder_num_layers = 6
dropout = 0.1

[model_v4]
# Part-aware Transformer w/ Temporal Convolutions
hidden_dim = 256
num_heads = 8
num_layers = 4
dropout = 0.1

[training]
experiment = "v5-mid-cosign"
device = "auto" # "cuda", "cpu", "auto"
batch_size = 32
learning_rate = 1e-4
num_epochs = 100
weight_decay = 0.01
gradient_accumulation_steps = 4

[lr_scheduler]
# "cosine_with_warmup" or "none"
type = "cosine_with_warmup"
warmup_epochs = 20            # 预热轮次

[masking]
total_mask_ratio = 0.20      # (For V3 Model) 掩码总比例
spatial_mask_ratio = 0.15     # 空间（关键点）掩码比例
temporal_mask_ratio = 0.05    # 时间（帧）掩码比例
confidence_threshold = 0.3
pre_context_length = 5        # 桥段左侧可见长度
post_context_length = 5       # 桥段右侧可见长度
gap_length = 6               # Bridge-mask 连续帧长度

[loss_weights]
# 这些是超参数，需要仔细调整。建议从一个较小的值开始。
lambda_recon = 1.0     # 重建损失权重
lambda_vel = 0.1     # 速度损失权重
lambda_accel = 0.1   # 加速度损失权重
lambda_bone = 0.05    # 骨骼长度损失权重
lambda_tv = 0.01     # 总变差正则化权重
